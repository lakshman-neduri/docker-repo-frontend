<!DOCTYPE html>
<html>
<head>
    <title>Flask POC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
        }

        #response {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Flask POC</h1>

    <p>This application is running inside a Docker container.</p>

    <button onclick="checkHealth()">
        Check Health
    </button>

    <div id="response"></div>

</div>

<script>
    async function checkHealth() {

        const response = await fetch("/health");

        const data = await response.json();

        document.getElementById("response").innerText =
            "Status: " + data.status;
    }
</script>

</body>
</html>
